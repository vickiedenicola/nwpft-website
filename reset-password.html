<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password | National Wild Pig Task Force</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg"><link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="assets/styles.css?v=20260819">
</head>
<body data-page="reset">
<div data-layout="header"></div>

<section class="page-hero">
  <div class="page-hero-bg"></div>
  <div class="wrap">
    <div class="kicker">Members</div>
    <h1>Reset your password</h1>
  </div>
</section>

<section class="section">
  <div class="wrap">
    <div class="portal-card portal-card-narrow">
      <div id="portal-status" class="portal-status"></div>

      <div id="reset-request">
        <p class="portal-intro">Enter the email on your member profile and we&rsquo;ll send you a reset link.</p>
        <form id="reset-request-form" class="contact-form portal-form" novalidate>
          <div class="form-field">
            <label for="rf-email">Email</label>
            <input id="rf-email" type="email" name="email" autocomplete="email" required>
          </div>
          <button type="submit" class="btn btn-primary">Send reset link</button>
        </form>
      </div>

      <div id="reset-set" hidden>
        <p class="portal-intro">Choose a new password for your account.</p>
        <form id="reset-set-form" class="contact-form portal-form" novalidate>
          <div class="form-field">
            <label for="rs-password">New password</label>
            <input id="rs-password" type="password" name="new_password" autocomplete="new-password" minlength="8" required>
          </div>
          <div class="form-field">
            <label for="rs-password2">Confirm new password</label>
            <input id="rs-password2" type="password" name="new_password2" autocomplete="new-password" minlength="8" required>
          </div>
          <button type="submit" class="btn btn-primary">Set new password</button>
        </form>
      </div>

      <p id="reset-done" class="portal-links" hidden><a href="account.html">Go to my account &rarr;</a></p>
      <p class="portal-links"><a href="login.html">Back to sign in</a></p>
    </div>
  </div>
</section>

<div data-layout="footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.min.js" integrity="sha384-l8ah+VgaWtk1mvOe9VC+OirC6qHFF4yH7l7mKRidV9MSti3E9F463bMp6ZVN4kuC" crossorigin="anonymous"></script>
<script src="assets/portal-config.js"></script>
<script src="assets/portal.js"></script>
<script src="assets/layout.js"></script>
</body>
</html>
