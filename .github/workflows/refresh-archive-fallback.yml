name: Refresh archive fallback

# assets/publications.csv is the snapshot the site serves if the Subcommittee's
# published sheet is ever unreachable. It is only useful if it is current, so
# pull the sheet weekly and commit it when it has changed.
#
# The refresh script refuses to write unless the download passes every sanity
# check (real CSV, expected columns, plausible paper count). If the sheet is
# broken or un-published, this run goes red and the existing snapshot is left
# alone — which is the whole point, since that is exactly when it gets used.
#
# GitHub disables scheduled workflows in repos with no pushes for 60 days. If
# this stops firing, that is usually why; a manual run re-arms it.

on:
  schedule:
    - cron: '17 7 * * 1'      # Mondays, 07:17 UTC
  workflow_dispatch:           # Actions tab > Run workflow, for a refresh on demand

permissions:
  contents: write

concurrency:
  group: refresh-archive-fallback
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull the sheet and validate it
        run: python3 scripts/refresh_archive_fallback.py

      - name: Commit if the snapshot changed
        run: |
          if git diff --quiet -- assets/publications.csv; then
            echo "No change — snapshot already matches the sheet."
            exit 0
          fi

          # Count with a CSV parser, not wc -l: a note containing a newline
          # would make a line count wrong.
          git show HEAD:assets/publications.csv > /tmp/before.csv
          count() { python3 -c "import csv,sys; print(sum(1 for _ in csv.DictReader(open(sys.argv[1]))))" "$1"; }
          before=$(count /tmp/before.csv)
          after=$(count assets/publications.csv)

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/publications.csv
          git commit -m "Refresh archive fallback from the published sheet

          ${before} papers -> ${after}. assets/publications.csv is the snapshot
          the archive falls back to when the Subcommittee's published sheet is
          unreachable; this keeps it current. Generated by
          .github/workflows/refresh-archive-fallback.yml."
          git push
          echo "Committed: ${before} -> ${after} papers."
