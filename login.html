<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member sign in | National Wild Pig Task Force</title>
<meta name="description" content="Sign in to manage your National Wild Pig Task Force member profile.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg"><link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="assets/styles.css?v=20260820c">
</head>
<body data-page="login">
<div data-layout="header"></div>

<section class="page-hero">
  <div class="page-hero-bg"></div>
  <div class="wrap">
    <div class="kicker">Members</div>
    <h1>Sign in</h1>
  </div>
</section>

<section class="section">
  <div class="wrap">
    <div class="portal-card portal-card-narrow">
      <p class="portal-intro">No passwords here. Enter the email on your member profile and we&rsquo;ll send you a secure one-time sign-in link.</p>
      <div id="portal-status" class="portal-status"></div>
      <form id="login-form" class="contact-form portal-form" novalidate>
        <div class="form-field">
          <label for="lf-email">Email</label>
          <input id="lf-email" type="email" name="email" autocomplete="email" required>
        </div>
        <button type="submit" class="btn btn-primary">Email me a sign-in link</button>
      </form>
      <form id="code-form" class="contact-form portal-form" novalidate hidden>
        <div class="form-field">
          <label for="lc-code">6-digit code from the email</label>
          <input id="lc-code" type="text" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required>
        </div>
        <button type="submit" class="btn btn-dark">Sign in with code</button>
      </form>
      <p class="portal-links"><a href="#" id="code-toggle">Already have a sign-in code? Enter it here</a></p>
      <p class="portal-links">New to the Task Force? <a href="signup.html">Become a member</a></p>
    </div>
  </div>
</section>

<div data-layout="footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.min.js" integrity="sha384-l8ah+VgaWtk1mvOe9VC+OirC6qHFF4yH7l7mKRidV9MSti3E9F463bMp6ZVN4kuC" crossorigin="anonymous"></script>
<script src="assets/portal-config.js?v=20260820c"></script>
<script src="assets/portal.js?v=20260820c"></script>
<script src="assets/layout.js"></script>
</body>
</html>
